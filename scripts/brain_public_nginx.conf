# Public test traffic can reach only the health and authenticated webhook routes.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $uri $brain_log_route {
        default blocked;
        /health health;
        /api/v1/webhooks/gitlab webhook;
    }
    log_format brain '$time_iso8601 route=$brain_log_route method=$request_method status=$status duration=$request_time';
    access_log /dev/stdout brain;

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 10m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        set $brain_backend api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host api;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        location = /health {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://$brain_backend/health;
        }

        location = /api/v1/webhooks/gitlab {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$brain_backend/api/v1/webhooks/gitlab;
        }

        location / { return 404; }
    }
}
