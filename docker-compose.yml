services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - repos_data:/data/repos
      - logs_data:/data/logs
      - brain_data:/data/project_brain:ro
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - repos_data:/data/repos
      - logs_data:/data/logs
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} --concurrency=${CELERY_CONCURRENCY:-2} -Q review,celery,readme
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  brain-worker:
    profiles: ["brain"]
    build: .
    env_file: .env
    environment:
      PROJECT_BRAIN_WORK_DIR: /data/project_brain_work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - repos_data:/data/repos
      - logs_data:/data/logs
      - brain_data:/data/project_brain
      - brain_work_data:/data/project_brain_work
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} --concurrency=${PROJECT_BRAIN_CONCURRENCY:-2} -Q brain -n brain@%h
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  celery-beat:
    profiles: ["brain"]
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - brain_beat_data:/data/beat
    restart: unless-stopped
    command: celery -A src.tasks.celery_app beat --loglevel=info --schedule=/data/beat/celerybeat-schedule
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  brain-publisher:
    profiles: ["brain"]
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres@postgres:5432/obc_review}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.example.com/}
      GITLAB_BRAIN_PUBLISH_TOKEN_FILE: /run/secrets/brain_publish_token
      PROJECT_BRAIN_ENABLED: ${PROJECT_BRAIN_ENABLED:-false}
      PROJECT_BRAIN_BASE_DIR: /data/project_brain
      PROJECT_BRAIN_MAX_SOURCE_FILES: ${PROJECT_BRAIN_MAX_SOURCE_FILES:-20000}
      PROJECT_BRAIN_MR_AUTO_MERGE: ${PROJECT_BRAIN_MR_AUTO_MERGE:-true}
      PROJECT_BRAIN_TEMP_BRANCH_PREFIX: ${PROJECT_BRAIN_TEMP_BRANCH_PREFIX:-ai-brain/}
      MAIN_BRANCHES: ${MAIN_BRANCHES:-main,master}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    secrets:
      - brain_publish_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - brain_data:/data/project_brain:ro
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=1 -Q brain-publication -n brain-publisher@%h
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: obc-review-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: obc_review
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obc_review"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  redisdata:
  repos_data:
  logs_data:
  brain_data:
  brain_beat_data:
  brain_work_data:
secrets:
  brain_publish_token:
    file: ${PROJECT_BRAIN_PUBLISH_TOKEN_PATH:-./secrets/brain_publish_token}
